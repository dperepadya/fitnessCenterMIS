<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>Trainer Schedule Item</h1>
    <p><strong>Fitness center ID:</strong> {{ fc_id }}</p>
    <p><strong>Trainer ID:</strong> {{ trainer_id }}</p>
    <p><strong>ID:</strong> {{ schedule.id }}</p>
    <p><strong>Date:</strong> {{ schedule.date}}</p>
    <p><strong>Start time:</strong> {{ schedule.start_time }}</p>
    <p><strong>End time:</strong> {{ schedule.end_time }}</p>
    {% if is_admin %}
        <form action="/fitness_center/{{ fc_id}}/trainers/{{ trainer_id }}/schedule/{{ schedule.id }}/delete" method="post" style="display:inline;">
           <button type="submit">Delete</button>
        </form>
    {% endif %}
    <a href="/fitness_center/{{ fc_id }}/trainers/{{ trainer_id }}/schedule"><button>Back</button></a>
    <a href="/"><button>Home</button></a>
</body>
</html>
