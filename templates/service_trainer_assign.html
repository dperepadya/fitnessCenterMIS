<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>Assign Trainer to Service</h1>
    <p><strong>Fitness center ID:</strong> {{ fc_id }}</p>
    <p><strong>Service ID:</strong> {{ service_id }}</p>
    <form action="/fitness_center/{{ fc_id }}/services/{{ service_id }}/addtrainer" method="post">
        <label for="trainer_id">Trainer:</label>
        <select id="trainer_id" name="trainer_id" required>
            {% for trainer in trainers %}
                <option value="{{ trainer.id }}">{{ trainer.name }}</option>
            {% endfor %}
        </select><br>
        <label for="capacity">Capacity:</label>
        <input type="number" id="capacity" name="capacity" required><br>
        <input type="submit" value="Submit">
    </form>
    <a href="/fitness_center/{{ fc_id }}/services/{{ service_id }}/trainers"><button>Back</button></a>
    <a href="/"><button>Home</button></a>
</body>
</html>
