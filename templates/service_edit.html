<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <form action="/fitness_center/{{ service['fitness_center_id'] }}/services/{{ service['id'] }}/edit" method="post">
        <input type="hidden" name="fc_id" value="{{ service['fitness_center_id'] }}">
        <input type="hidden" name="serv_id" value="{{ service['id'] }}">
        <label for="name">Name:       </label>
        <input type="text" id="name" name="name" value="{{ service['name'] }}" required><br>
        <label for="duration">Duration:  </label>
        <input type="number" id="duration" name="duration" step="1" value="{{ service['duration'] }}" required><br>
        <label for="price">Price     :     </label>
        <input type="number" id="price" name="price" step="0.01" value="{{ service['price'] }}" required><br>
        <label for="description">Description: </label>
        <input type="text" id="description" name="description" value="{{ service['description'] }}" required><br>
        <label for="max_attendees">Max attendees     :     </label>
        <input type="number" id="max_attendees" name="max_attendees" step="1" value="{{ service['max_attendees'] }}" required><br>
        <input type="submit" value="Submit">
    </form>
    <a href="/fitness_center/{{ service['fitness_center_id'] }}/services/{{ service['id'] }}"><button>Back</button></a>
    <a href="/"><button>Home</button></a>
</body>
</html>
