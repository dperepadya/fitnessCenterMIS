<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>Assign Service</h1>
    <p><strong>Fitness center ID:</strong> {{ fc_id }}</p>
    <p><strong>Service ID:</strong> {{ service_id }}</p>
    <p><strong>Trainer ID:</strong> {{ trainer_id }}</p>
    <form action="/fitness_center/{{ fc_id }}/trainers/{{ trainer_id }}/services/{{ service_id }}/add" method="post">
        <label for="capacity">Capacity:</label>
        <input type="number" id="capacity" name="capacity" step="1" required><br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
