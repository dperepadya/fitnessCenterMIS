<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>Assign Service to Trainer</h1>
    <p><strong>Fitness center ID:</strong> {{ fc_id }}</p>
    <p><strong>Trainer ID:</strong> {{ trainer_id }}</p>
    <form action="/fitness_center/{{ fc_id }}/trainers/{{ trainer_id }}/addservice" method="post">
        <label for="service_id">Service:</label>
        <select id="service_id" name="service_id" required>
            {% for service in services %}
                <option value="{{ service.id }}">{{ service.name }}</option>
            {% endfor %}
        </select><br>
        <label for="capacity">Capacity:</label>
        <input type="number" id="capacity" name="capacity" required><br>
        <input type="submit" value="Submit">
    </form>
    <a href="/fitness_center/{{ fc_id }}/trainers/{{ trainer_id }}/services"><button>Back</button></a>
    <a href="/"><button>Home</button></a>
</body>
</html>
